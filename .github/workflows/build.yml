name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0" "platforms;android-36" > /dev/null
      - name: Build
        run: sh scripts/build.sh
      - name: Check for secrets in the repository
        run: |
          ! git ls-files | grep -E '\.(jks|keystore|p12|pem|key)$|keystore\.properties|adbkey'
      - uses: actions/upload-artifact@v4
        with:
          name: odin-tv-magic-ci
          path: build/odin-tv-magic.apk
